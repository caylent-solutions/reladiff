[tool.poetry]
name = "reladiff"
version = "0.6.1"
description = "Command-line tool and Python library to efficiently diff rows across two different databases."
authors = ["Erez Shinan <erezshin@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/erezsh/reladiff"
documentation = "https://reladiff.readthedocs.io/en/latest/"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed"
]
packages = [{ include = "reladiff" }]

[tool.poetry.dependencies]
python = "^3.9"
runtype = ">=0.5.0"
dsnparse = "*"
click = ">=8.1"
rich = "*"
toml = ">=0.10.2"
sqeleton = "^0.1.7"
mysql-connector-python = {version=">=8.0.29", optional=true}
psycopg2-binary = {version=">=2.8.6", optional=true}
snowflake-connector-python = {version=">=2.7.2", optional=true}
cryptography = {version="*", optional=true}
trino = {version=">=0.314.0", optional=true}
presto-python-client = {version="*", optional=true}
clickhouse-driver = {version="*", optional=true}
duckdb = {version=">=0.6.0", optional=true}
pymssql = {version="*", optional=true}
boto3 = {version=">=1.26.0", optional=true}
cx_Oracle = {version="*", optional=true}
vertica-python = {version="*", optional=true}
psutil = "^7.0.0"
requests = "^2.32.5"
plotly = "^6.3.0"
kaleido = "^1.0.0"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
parameterized = "*"
unittest-parallel = "*"
# preql = ">=0.2.19"
mysql-connector-python = "*"
psycopg2-binary = "*"
snowflake-connector-python = ">=2.7.2"
cryptography = "*"
trino = ">=0.314.0"
presto-python-client = "*"
clickhouse-driver = "*"
vertica-python = "*"
duckdb = ">=0.6.0"
pymssql = "*"
# google-cloud-bigquery = "*"
# databricks-sql-connector = "*"
aws-sam-cli = "*"
boto3 = "*"
moto = "^5.1.10"
pytest = "^8.4.1"
pandas = "*"
matplotlib = "*"
plotly = "*"

[tool.poetry.extras]
# When adding, update also: README + dev deps just above
mysql = ["mysql-connector-python"]
postgresql = ["psycopg2-binary"]
babelfish = ["pymssql"]
snowflake = ["snowflake-connector-python", "cryptography"]
presto = ["presto-python-client"]
oracle = ["cx_Oracle"]
# databricks = ["databricks-sql-connector"]
trino = ["trino"]
clickhouse = ["clickhouse-driver"]
vertica = ["vertica-python"]
duckdb = ["duckdb"]
mssql = ["pymssql"]
aws = ["boto3"]

all = ["mysql-connector-python", "psycopg2-binary", "snowflake-connector-python", "cryptography", "presto-python-client", "cx_Oracle", "trino", "clickhouse-driver", "vertica-python", "duckdb", "pymssql", "boto3"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
reladiff = 'reladiff.__main__:main'

[tool.mypy]
no_implicit_optional=false

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
target-version = ['py38']
