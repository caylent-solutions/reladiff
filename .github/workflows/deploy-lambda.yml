name: Deploy Reladiff Lambda Architecture

on:
  push:
    branches: [main, master]
    paths:
      - 'lambda/**'
      - 'template.yaml'
      - '.github/workflows/deploy-lambda.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'lambda/**'
      - 'template.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      build_containers:
        description: 'Build and push container images'
        required: false
        default: false
        type: boolean
      notification_email:
        description: 'Email for deployment notifications'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.9'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
        pip install pytest moto boto3 psutil
    
    - name: Run unit tests
      run: |
        poetry run python -m pytest tests/test_lambda_functions.py -v --tb=short
    
    - name: Run integration tests
      run: |
        poetry run python -m pytest tests/test_lambda_integration.py -v --tb=short
    
    - name: Generate test coverage
      run: |
        poetry run python -m pytest tests/ --cov=lambda --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: lambda-tests
        name: lambda-coverage

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy
    
    - name: Run black formatter check
      run: |
        black --check --line-length 120 lambda/ reladiff/
    
    - name: Run ruff linter
      run: |
        ruff check lambda/ reladiff/
    
    - name: Run mypy type checker
      run: |
        mypy lambda/ --ignore-missing-imports --no-strict-optional

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Bandit security scan
      uses: PyCQA/bandit-action@v1
      with:
        path: "lambda/"
        level: "high"
        confidence: "high"
    
    - name: Run Safety vulnerability check
      run: |
        pip install safety
        safety check --json --output safety-report.json || true
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.txt

  build:
    name: Build Lambda Packages
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install SAM CLI
      uses: aws-actions/setup-sam@v2
    
    - name: Build SAM application
      run: |
        sam build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sam-build-artifacts
        path: .aws-sam/
        retention-days: 7

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment: 
      name: development
      url: ${{ steps.deploy.outputs.api_endpoint }}
    
    outputs:
      api_endpoint: ${{ steps.deploy.outputs.api_endpoint }}
      stack_name: ${{ steps.deploy.outputs.stack_name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: sam-build-artifacts
        path: .aws-sam/
    
    - name: Install SAM CLI
      uses: aws-actions/setup-sam@v2
    
    - name: Deploy to development
      id: deploy
      run: |
        ENVIRONMENT="dev"
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        fi
        
        STACK_NAME="reladiff-serverless-${ENVIRONMENT}"
        
        # Prepare parameters
        PARAMETERS="Environment=${ENVIRONMENT}"
        
        if [ -n "${{ github.event.inputs.notification_email }}" ]; then
          PARAMETERS="${PARAMETERS} NotificationEmail=${{ github.event.inputs.notification_email }}"
        elif [ -n "${{ secrets.NOTIFICATION_EMAIL }}" ]; then
          PARAMETERS="${PARAMETERS} NotificationEmail=${{ secrets.NOTIFICATION_EMAIL }}"
        fi
        
        # Deploy with SAM
        sam deploy \
          --stack-name "${STACK_NAME}" \
          --region "${{ env.AWS_REGION }}" \
          --capabilities CAPABILITY_IAM \
          --parameter-overrides ${PARAMETERS} \
          --no-confirm-changeset \
          --resolve-s3 \
          --no-fail-on-empty-changeset
        
        # Get outputs
        API_ENDPOINT=$(aws cloudformation describe-stacks \
          --stack-name "${STACK_NAME}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
          --output text)
        
        echo "api_endpoint=${API_ENDPOINT}" >> $GITHUB_OUTPUT
        echo "stack_name=${STACK_NAME}" >> $GITHUB_OUTPUT
        
        # Create deployment summary
        cat > deployment-summary.json << EOF
        {
          "environment": "${ENVIRONMENT}",
          "stack_name": "${STACK_NAME}",
          "region": "${{ env.AWS_REGION }}",
          "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "api_endpoint": "${API_ENDPOINT}",
          "commit_sha": "${{ github.sha }}",
          "workflow_run_id": "${{ github.run_id }}"
        }
        EOF
    
    - name: Upload deployment summary
      uses: actions/upload-artifact@v3
      with:
        name: deployment-summary-dev
        path: deployment-summary.json
    
    - name: Run post-deployment tests
      run: |
        # Install test dependencies
        pip install requests boto3
        
        # Wait for API to be ready
        sleep 30
        
        # Basic health check
        API_ENDPOINT="${{ steps.deploy.outputs.api_endpoint }}"
        if [ -n "${API_ENDPOINT}" ]; then
          echo "Testing API endpoint: ${API_ENDPOINT}"
          curl -f "${API_ENDPOINT}" || echo "API not yet responding (expected for cold start)"
        fi

  build-containers:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event.inputs.build_containers == 'true' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build-containers]'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push container images
      run: |
        cd lambda
        ENVIRONMENT="dev"
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        fi
        
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        ./build.sh "${ENVIRONMENT}" "${AWS_ACCOUNT_ID}" "${{ env.AWS_REGION }}"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: 
      name: staging
      url: ${{ steps.deploy.outputs.api_endpoint }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
        role-duration-seconds: 3600
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: sam-build-artifacts
        path: .aws-sam/
    
    - name: Install SAM CLI
      uses: aws-actions/setup-sam@v2
    
    - name: Deploy to staging
      id: deploy
      run: |
        STACK_NAME="reladiff-serverless-staging"
        
        PARAMETERS="Environment=staging"
        if [ -n "${{ secrets.STAGING_NOTIFICATION_EMAIL }}" ]; then
          PARAMETERS="${PARAMETERS} NotificationEmail=${{ secrets.STAGING_NOTIFICATION_EMAIL }}"
        fi
        
        sam deploy \
          --stack-name "${STACK_NAME}" \
          --region "${{ env.AWS_REGION }}" \
          --capabilities CAPABILITY_IAM \
          --parameter-overrides ${PARAMETERS} \
          --no-confirm-changeset \
          --resolve-s3 \
          --no-fail-on-empty-changeset
        
        API_ENDPOINT=$(aws cloudformation describe-stacks \
          --stack-name "${STACK_NAME}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
          --output text)
        
        echo "api_endpoint=${API_ENDPOINT}" >> $GITHUB_OUTPUT

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment: 
      name: production
      url: ${{ steps.deploy.outputs.api_endpoint }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
        role-duration-seconds: 3600
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: sam-build-artifacts
        path: .aws-sam/
    
    - name: Install SAM CLI
      uses: aws-actions/setup-sam@v2
    
    - name: Deploy to production
      id: deploy
      run: |
        STACK_NAME="reladiff-serverless-prod"
        
        PARAMETERS="Environment=prod WorkerMemorySize=3008 WorkerTimeout=900"
        if [ -n "${{ secrets.PRODUCTION_NOTIFICATION_EMAIL }}" ]; then
          PARAMETERS="${PARAMETERS} NotificationEmail=${{ secrets.PRODUCTION_NOTIFICATION_EMAIL }}"
        fi
        
        sam deploy \
          --stack-name "${STACK_NAME}" \
          --region "${{ env.AWS_REGION }}" \
          --capabilities CAPABILITY_IAM \
          --parameter-overrides ${PARAMETERS} \
          --no-confirm-changeset \
          --resolve-s3 \
          --no-fail-on-empty-changeset
        
        API_ENDPOINT=$(aws cloudformation describe-stacks \
          --stack-name "${STACK_NAME}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
          --output text)
        
        echo "api_endpoint=${API_ENDPOINT}" >> $GITHUB_OUTPUT
    
    - name: Run production smoke tests
      run: |
        # Add production-specific validation here
        echo "Production deployment successful"

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production]
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    
    steps:
    - name: Send Slack notification
      if: secrets.SLACK_WEBHOOK_URL
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            attachments: [{
              color: '${{ job.status }}' === 'success' ? 'good' : 'danger',
              text: `Reladiff Lambda deployment ${{ job.status }}!\nCommit: ${{ github.sha }}\nEnvironment: ${{ github.event.inputs.environment || 'dev' }}\nAPI Endpoint: ${{ needs.deploy-dev.outputs.api_endpoint || needs.deploy-staging.outputs.api_endpoint || needs.deploy-production.outputs.api_endpoint }}`
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Create GitHub release
      if: github.ref == 'refs/heads/main' && needs.deploy-production.result == 'success'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          Reladiff Lambda Architecture Release
          
          **Deployed to Production:**
          - API Endpoint: ${{ needs.deploy-production.outputs.api_endpoint }}
          - Commit: ${{ github.sha }}
          - Workflow: ${{ github.run_id }}
          
          **Changes:**
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false