name: Lambda Benchmarks

on:
  # Manual trigger for on-demand benchmarking
  workflow_dispatch:
    inputs:
      dataset_size:
        description: 'Dataset size to benchmark'
        required: true
        default: '1m'
        type: choice
        options:
          - '1m'
          - '25m'
      test_filter:
        description: 'Specific tests to run (comma-separated, leave empty for all)'
        required: false
        type: string
      generate_graphs:
        description: 'Generate performance graphs'
        required: false
        default: true
        type: boolean
      stack_name:
        description: 'CloudFormation stack name'
        required: false
        default: 'reladiff-serverless-dev'
        type: string
      
  # Scheduled benchmarks
  schedule:
    # Run weekly benchmarks on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

  # Run benchmarks on releases
  release:
    types: [published]

  # Run benchmarks on main branch pushes that affect core diff logic
  push:
    branches: [main, master]
    paths:
      - 'reladiff/**'
      - 'lambda/**'
      - 'pyproject.toml'
      - '.github/workflows/lambda-benchmarks.yml'

  # Run benchmarks on PRs that affect core logic
  pull_request:
    branches: [main, master]
    paths:
      - 'reladiff/**'
      - 'lambda/**'
      - 'pyproject.toml'

env:
  AWS_REGION: us-east-1
  STACK_NAME: ${{ github.event.inputs.stack_name || 'reladiff-serverless-dev' }}

jobs:
  benchmark-1m:
    name: Benchmark 1M Dataset
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.dataset_size != '25m' || github.event_name != 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          
      - name: Load cached venv
        id: cache-poetry-deps
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          
      - name: Install dependencies
        if: steps.cache-poetry-deps.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
        
      - name: Install project
        run: poetry install --no-interaction
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Check Lambda deployment status
        id: check_deployment
        run: |
          if aws lambda get-function --function-name reladiff-table-populator-dev --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "lambdas_deployed=true" >> $GITHUB_OUTPUT
          else
            echo "lambdas_deployed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Deploy Lambda infrastructure
        if: steps.check_deployment.outputs.lambdas_deployed == 'false'
        run: |
          # Install SAM CLI
          pip install aws-sam-cli
          
          # Build and deploy
          sam build
          sam deploy --stack-name ${{ env.STACK_NAME }} --resolve-s3 --capabilities CAPABILITY_IAM --no-confirm-changeset
          
      - name: Execute 1M benchmark
        id: benchmark_1m
        run: |
          # Determine test filter
          TEST_FILTER=""
          if [[ "${{ github.event.inputs.test_filter }}" != "" ]]; then
            IFS=',' read -ra FILTERS <<< "${{ github.event.inputs.test_filter }}"
            for filter in "${FILTERS[@]}"; do
              TEST_FILTER="$TEST_FILTER --test-filter $(echo $filter | xargs)"
            done
          fi
          
          # Execute benchmark
          poetry run python benchmark_lambda.py \
            --dataset-size 1m \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            $TEST_FILTER
            
      - name: Generate performance graphs
        if: ${{ github.event.inputs.generate_graphs != 'false' }}
        run: |
          # Download latest benchmark results
          LATEST_CSV=$(poetry run python benchmark_lambda.py --download-results --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }} | grep "Downloaded results to:" | cut -d' ' -f4)
          
          if [[ -f "$LATEST_CSV" ]]; then
            # Generate graphs
            poetry run python benchmark_lambda.py --generate-graphs --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }}
            
            # Find generated graph files
            find . -name "*.png" -o -name "*.svg" | head -10
          fi
          
      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: benchmark-results-1m-${{ github.run_number }}
          path: |
            benchmark_*.csv
            *.png
            *.svg
          retention-days: 30
          
      - name: Upload results to S3
        if: success()
        run: |
          # Get the results bucket
          RESULTS_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }} --query 'Stacks[0].Outputs[?OutputKey==`ResultsBucket`].OutputValue' --output text)
          
          # Upload artifacts with GitHub metadata
          if [[ -f "benchmark_*.csv" ]]; then
            aws s3 cp benchmark_*.csv s3://$RESULTS_BUCKET/github-actions/${{ github.run_number }}/benchmark-1m.csv \
              --metadata "github-run-id=${{ github.run_id }},github-sha=${{ github.sha }},github-ref=${{ github.ref }}"
          fi
          
      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find benchmark CSV file
            const files = fs.readdirSync('.');
            const csvFile = files.find(f => f.startsWith('benchmark_') && f.endsWith('.csv'));
            
            if (!csvFile) {
              console.log('No benchmark results found');
              return;
            }
            
            // Parse CSV results
            const csvContent = fs.readFileSync(csvFile, 'utf8');
            const lines = csvContent.trim().split('\n');
            const headers = lines[0].split(',');
            const results = lines.slice(1).map(line => {
              const values = line.split(',');
              const result = {};
              headers.forEach((header, i) => result[header] = values[i]);
              return result;
            });
            
            // Generate summary
            const successful = results.filter(r => r.status === 'SUCCESS');
            const failed = results.filter(r => r.status === 'FAILED');
            
            let summary = `## 🚀 Lambda Benchmark Results (1M Dataset)\n\n`;
            summary += `**Overall:** ${successful.length}/${results.length} tests successful\n\n`;
            
            if (successful.length > 0) {
              summary += `### ✅ Successful Tests\n`;
              summary += `| Test | Duration (s) | Rows/sec | Memory (MB) | Diff Ops |\n`;
              summary += `|------|-------------|----------|-------------|----------|\n`;
              
              successful.forEach(test => {
                const duration = parseFloat(test.duration_seconds || 0).toFixed(2);
                const rowsPerSec = parseInt(test.rows_per_second || 0).toLocaleString();
                const memory = parseFloat(test.peak_memory_mb || 0).toFixed(1);
                const diffOps = parseInt(test.diff_operations || 0).toLocaleString();
                summary += `| ${test.test_name} | ${duration} | ${rowsPerSec} | ${memory} | ${diffOps} |\n`;
              });
              summary += `\n`;
            }
            
            if (failed.length > 0) {
              summary += `### ❌ Failed Tests\n`;
              failed.forEach(test => {
                summary += `- **${test.test_name}**: ${test.error || 'Unknown error'}\n`;
              });
              summary += `\n`;
            }
            
            summary += `<details><summary>📊 Raw Results</summary>\n\n\`\`\`csv\n${csvContent}\n\`\`\`\n\n</details>`;
            
            // Comment on PR
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  benchmark-25m:
