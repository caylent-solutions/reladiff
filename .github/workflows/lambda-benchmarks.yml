  performance-regression-check:
    name: Performance Regression Analysis
    runs-on: ubuntu-latest
    needs: [benchmark-1m]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Download current benchmark results
        uses: actions/download-artifact@v3
        with:
          name: benchmark-results-1m-${{ github.run_number }}
          path: ./current-results/
          
      - name: Get baseline benchmark from main branch
        run: |
          # Get the results bucket
          RESULTS_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }} --query 'Stacks[0].Outputs[?OutputKey==`ResultsBucket`].OutputValue' --output text)
          
          # Try to find recent baseline results from main branch
          aws s3 ls s3://$RESULTS_BUCKET/github-actions/ --recursive | grep benchmark-1m.csv | tail -5 | while read -r line; do
            file=$(echo $line | awk '{print $4}')
            aws s3 cp s3://$RESULTS_BUCKET/$file ./baseline-results/$(basename $file) || true
          done
          
      - name: Analyze performance regression
        run: |
          python3 << 'EOF'
          import csv
          import json
          import os
          import glob
          from typing import Dict, List
          
          def load_benchmark_results(file_path: str) -> Dict:
              """Load benchmark results from CSV file"""
              results = {}
              try:
                  with open(file_path, 'r') as f:
                      reader = csv.DictReader(f)
                      for row in reader:
                          if row.get('status') == 'SUCCESS':
                              results[row['test_name']] = {
                                  'duration_seconds': float(row.get('duration_seconds', 0)),
                                  'rows_per_second': float(row.get('rows_per_second', 0)),
                                  'peak_memory_mb': float(row.get('peak_memory_mb', 0))
                              }
              except Exception as e:
                  print(f"Error loading {file_path}: {e}")
              return results
          
          def compare_results(current: Dict, baseline: Dict) -> Dict:
              """Compare current results with baseline"""
              comparison = {
                  'regressions': [],
                  'improvements': [],
                  'new_tests': [],
                  'missing_tests': []
              }
              
              for test_name in current:
                  if test_name not in baseline:
                      comparison['new_tests'].append(test_name)
                      continue
                      
                  curr = current[test_name]
                  base = baseline[test_name]
                  
                  # Check duration regression (>20% slower)
                  duration_ratio = curr['duration_seconds'] / base['duration_seconds'] if base['duration_seconds'] > 0 else 1
                  if duration_ratio > 1.2:
                      comparison['regressions'].append({
                          'test': test_name,
                          'metric': 'duration',
                          'change': f"{(duration_ratio - 1) * 100:.1f}% slower",
                          'current': curr['duration_seconds'],
                          'baseline': base['duration_seconds']
                      })
                  elif duration_ratio < 0.8:
                      comparison['improvements'].append({
                          'test': test_name, 
                          'metric': 'duration',
                          'change': f"{(1 - duration_ratio) * 100:.1f}% faster",
                          'current': curr['duration_seconds'],
                          'baseline': base['duration_seconds']
                      })
              
              for test_name in baseline:
                  if test_name not in current:
                      comparison['missing_tests'].append(test_name)
                      
              return comparison
          
          # Load current results
          current_files = glob.glob('./current-results/benchmark_*.csv')
          if not current_files:
              print("No current benchmark results found")
              exit(0)
              
          current_results = load_benchmark_results(current_files[0])
          
          # Load baseline results
          baseline_files = glob.glob('./baseline-results/benchmark*.csv')
          if not baseline_files:
              print("No baseline benchmark results found - skipping regression analysis")
              exit(0)
              
          baseline_results = load_benchmark_results(baseline_files[-1])  # Use most recent
          
          # Compare results
          comparison = compare_results(current_results, baseline_results)
          
          # Generate summary
          summary = f"## 📊 Performance Regression Analysis\n\n"
          
          if comparison['regressions']:
              summary += f"### 🔴 Performance Regressions ({len(comparison['regressions'])} found)\n"
              for reg in comparison['regressions']:
                  summary += f"- **{reg['test']}** ({reg['metric']}): {reg['change']} ({reg['current']:.2f}s vs {reg['baseline']:.2f}s)\n"
              summary += "\n"
          
          if comparison['improvements']:
              summary += f"### 🟢 Performance Improvements ({len(comparison['improvements'])} found)\n"
              for imp in comparison['improvements']:
                  summary += f"- **{imp['test']}** ({imp['metric']}): {imp['change']} ({imp['current']:.2f}s vs {imp['baseline']:.2f}s)\n"
              summary += "\n"
              
          if comparison['new_tests']:
              summary += f"### 🆕 New Tests ({len(comparison['new_tests'])} found)\n"
              for test in comparison['new_tests']:
                  summary += f"- {test}\n"
              summary += "\n"
              
          if comparison['missing_tests']:
              summary += f"### ⚠️ Missing Tests ({len(comparison['missing_tests'])} found)\n"
              for test in comparison['missing_tests']:
                  summary += f"- {test}\n"
              summary += "\n"
          
          if not any([comparison['regressions'], comparison['improvements'], comparison['new_tests'], comparison['missing_tests']]):
              summary += "### ✅ No significant performance changes detected\n\n"
          
          # Save summary for GitHub comment
          with open('regression_summary.md', 'w') as f:
              f.write(summary)
              
          # Set exit code based on regressions
          if comparison['regressions']:
              print(f"❌ {len(comparison['regressions'])} performance regressions detected!")
              exit(1)
          else:
              print("✅ No performance regressions detected")
              exit(0)
          EOF
          
      - name: Comment on PR with regression analysis
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const summary = fs.readFileSync('regression_summary.md', 'utf8');
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              console.log('No regression summary found');
            }

  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    needs: [benchmark-1m, benchmark-25m]
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.cleanup == 'true'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Clean up old S3 results
        run: |
          # Get the results bucket
          RESULTS_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }} --query 'Stacks[0].Outputs[?OutputKey==`ResultsBucket`].OutputValue' --output text)
          
          # Delete results older than 30 days
          aws s3api list-objects-v2 --bucket $RESULTS_BUCKET --prefix github-actions/ --query 'Contents[?LastModified<`'$(date -d '30 days ago' --iso-8601)'`].Key' --output text | xargs -I {} aws s3 rm s3://$RESULTS_BUCKET/{} || true